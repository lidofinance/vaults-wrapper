name: Deploy (Hoodi Fork)

on:
  push:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy all to Hoodi fork
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      anvil:
        image: ghcr.io/lidofinance/hardhat-node:2.26.0
        ports:
          - 9123:8545
        env:
          ETH_RPC_URL: https://hoodi.drpc.org
          DONT_SET_CHAIN_ID: true
          HARDFORK: prague
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: ./.github/actions/setup
      - run: just -E .env.hoodi.local deploy-all .env.hoodi.local
