name: Setup
description: Setup Foundry, Just, and build contracts

inputs:
  just-version:
    description: "Just version to install"
    required: false
    default: "1.43.1"

runs:
  using: "composite"
  steps:
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1.8.0

    - name: Cache Just
      id: just-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cargo/bin/just
        key: just-${{ inputs.just-version }}-${{ runner.os }}

    - name: Install Just
      if: steps.just-cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install "just@${{ inputs.just-version }}"
